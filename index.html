    <style>
      /* Prevent Vite dev overlay popups and error dialogs for background network/websocket notifications */
      vite-error-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        // Global Unhandled Rejection & Error Trap for Firestore WebChannel / Assertion logs
        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          if (
            reason.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            reason.indexOf('c050') !== -1 ||
            reason.indexOf('FIRESTORE') !== -1 ||
            reason.indexOf('resource-exhausted') !== -1 ||
            reason.indexOf('Quota limit exceeded') ||
            reason.indexOf('Quota exceeded') !== -1 ||
            reason.indexOf('maximum backoff delay') !== -1 ||
            reason.indexOf('failed to connect to websocket') !== -1 ||
            reason.indexOf('[GSI_LOGGER]') !== -1 ||
            reason.indexOf('Failed to open popup window') !== -1 ||
            reason.indexOf('gsiwebsdk') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.stopPropagation === 'function') {
              event.stopPropagation();
            }
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || String(event))) || '';
          if (
            msg.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            msg.indexOf('c050') !== -1 ||
            msg.indexOf('FIRESTORE') !== -1 ||
            msg.indexOf('resource-exhausted') !== -1 ||
            msg.indexOf('Quota limit exceeded') !== -1 ||
            msg.indexOf('Quota exceeded') !== -1 ||
            msg.indexOf('maximum backoff delay') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('[GSI_LOGGER]') !== -1 ||
            msg.indexOf('Failed to open popup window') !== -1 ||
            msg.indexOf('gsiwebsdk') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.stopPropagation === 'function') {
              event.stopPropagation();
            }
            return false;
          }
        }, true);

        // Intercept console errors/warnings for known benign library assertions
        var origError = console.error;
        console.error = function() {
          var argsStr = Array.prototype.slice.call(arguments).map(function(a) {
            return (typeof a === 'object') ? (JSON.stringify(a) || '') : String(a);
          }).join(' ');

          if (
            argsStr.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            argsStr.indexOf('c050') !== -1 ||
            argsStr.indexOf('FIRESTORE') !== -1 ||
            argsStr.indexOf('resource-exhausted') !== -1 ||
            argsStr.indexOf('Quota limit exceeded') !== -1 ||
            argsStr.indexOf('Quota exceeded') !== -1 ||
            argsStr.indexOf('maximum backoff delay') !== -1 ||
            argsStr.indexOf('failed to connect to websocket') !== -1 ||
            argsStr.indexOf('WebSocket closed without opened') !== -1 ||
            argsStr.indexOf('[GSI_LOGGER]') !== -1 ||
            argsStr.indexOf('Failed to open popup window') !== -1 ||
            argsStr.indexOf('gsiwebsdk') !== -1
          ) {
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var argsStr = Array.prototype.slice.call(arguments).map(function(a) {
            return (typeof a === 'object') ? (JSON.stringify(a) || '') : String(a);
          }).join(' ');

          if (
            argsStr.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            argsStr.indexOf('c050') !== -1 ||
            argsStr.indexOf('FIRESTORE') !== -1 ||
            argsStr.indexOf('resource-exhausted') !== -1 ||
            argsStr.indexOf('Quota limit exceeded') !== -1 ||
            argsStr.indexOf('Quota exceeded') !== -1 ||
            argsStr.indexOf('maximum backoff delay') !== -1 ||
            argsStr.indexOf('failed to connect to websocket') !== -1 ||
            argsStr.indexOf('WebSocket closed without opened') !== -1 ||
            argsStr.indexOf('[GSI_LOGGER]') !== -1 ||
            argsStr.indexOf('Failed to open popup window') !== -1 ||
            argsStr.indexOf('gsiwebsdk') !== -1
          ) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SW registered successfully:', reg.scope);
          }).catch(function(err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
